# E0 on nobara: amendment C3's fallback, goinfer main 0de92cd9, where each context was measured. An arm runs from here
# only if it does not come up cuda-resident at its context on f20f0d93 (e1-calibration-preregistration-2026-10-18.md
# §9), and the table says why.

box = "nobara"
goinfer_serve = "~/tack-runs/bin/goinfer-serve-cuda-0de92cd9"
goinfer_rev = "0de92cd9"
workspace = "~/tack-runs/e0/workspace/tack"

# Thinking off for every Qwen arm. tack sends thinking disabled on every request (the smoke, the probes, A1);
# -thinking off is the server default for anything that sends nothing (e1-calibration-preregistration-2026-10-18.md §9).
# probe_thinking stays unset: no arm here has reasoning that cannot be turned off.

[[arm]]
name = "qwen3.5-9b-q4km-cuda"
model_path = "~/models/Qwen3.5-9B-Q4_K_M.gguf"
args = ["-backend", "cuda", "-thinking", "off"]
ctx = [32768]

[[arm]]
name = "qwen3.6-35b-a3b-q4km-cuda-moecache"
model_path = "~/models/qwen3.6-35b-a3b-q4_k_m.gguf"
args = ["-backend", "cuda", "-moe-cache-experts", "-thinking", "off"]
ctx = [32768]

[[arm]]
name = "qwen3-8b-q4km-cuda"
model_path = "~/models/qwen3-8b-gguf/Qwen3-8B-Q4_K_M.gguf"
args = ["-backend", "cuda", "-thinking", "off"]
ctx = [16384]

[[arm]]
name = "qwen3-4b-cuda"
model_path = "~/models/qwen3-4b"
args = ["-backend", "cuda", "-thinking", "off"]
ctx = [30720]

[[arm]]
name = "granite-4.2-3b-cuda"
model_path = "~/models/granite-4.2-3b"
args = ["-backend", "cuda"] # thinking unmanaged: the template has no thinking control
ctx = [30720]
