# E0 on the Mac (M1 Pro 16 GB, macOS 26): the arms of docs/measurements/e0-preregistration-2026-10-16.md, in run order.
# Run by goinfer's scripts/night.py, one job per arm, never by day except -fit-only.

box = "mac"
# Built from goinfer 41e13b26 (metal/cmd/serve). The binary reports vcs.modified=true for one untracked doc
# (docs/audit-security-2026-10-12.md); no tracked file differed.
goinfer_serve = "~/tack-runs/bin/goinfer-serve-metal-41e13b26"
goinfer_rev = "41e13b26"
# A snapshot of tack at the queued commit (git archive), so "Repository: tack" and the TTFT text are pinned.
workspace = "~/tack-runs/e0/workspace/tack"

[[arm]]
name = "qwen2.5-7b-q4km-metal"
model_path = "~/models/qwen2.5-7b-instruct-q4_k_m.gguf"
args = ["-backend", "metal"]

[[arm]]
name = "gemma4-e4b-q40-metal"
model_path = "~/models/gemma-4-e4b-gguf/gemma-4-E4B_q4_0-it.gguf"
args = ["-backend", "metal"]

[[arm]]
name = "qwen2.5-coder-1.5b-q4km-metal"
model_path = "~/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
args = ["-backend", "metal"]

[[arm]]
name = "phi3-mini-4k-q4-metal"
model_path = "~/models/phi3-mini-4k-gguf/Phi-3-mini-4k-instruct-q4.gguf"
args = ["-backend", "metal"]
ctx = [4096]

[[arm]]
name = "qwen2.5-7b-q4km-cpu"
model_path = "~/models/qwen2.5-7b-instruct-q4_k_m.gguf"
args = ["-backend", "cpu"]
