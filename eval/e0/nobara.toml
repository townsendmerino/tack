# E0 on nobara (Ryzen 7 3700X, RTX 2070 SUPER 8 GB): the arms of docs/measurements/e0-preregistration-2026-10-16.md,
# in run order. Run by goinfer's scripts/night.py on nobara, one job per arm, never by day except -fit-only.

box = "nobara"
# Cross-built on the Mac from a git archive of goinfer main 0e598d3f: `go work init . ./cuda ./metal`, GOOS=linux
# GOARCH=amd64 CGO_ENABLED=0, -tags cuda, ./cuda/cmd/serve. Before amendment 3 this was 41e13b26 (the unmerged
# op3-seams-2026-10 branch); those runs are kept and superseded.
goinfer_serve = "~/tack-runs/bin/goinfer-serve-cuda-0e598d3f"
goinfer_rev = "0e598d3f"
# The same snapshot of tack at ea9d411 the Mac's jobs size their prompts from.
workspace = "~/tack-runs/e0/workspace/tack"

[[arm]]
name = "qwen2.5-7b-q4km-cuda" # the incumbent
model_path = "~/models/qwen2.5-7b-instruct-q4_k_m.gguf"
args = ["-backend", "cuda"]

[[arm]]
name = "gemma4-e4b-q40-cuda"
model_path = "~/models/gemma-4-e4b-gguf/gemma-4-E4B_q4_0-it.gguf"
args = ["-backend", "cuda"]

[[arm]]
name = "qwen2.5-coder-1.5b-q4km-cuda"
model_path = "~/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
args = ["-backend", "cuda"]

[[arm]]
name = "gemma4-e2b-q40-cuda"
model_path = "~/models/gemma-4-e2b-gguf/gemma-4-E2B_q4_0-it.gguf"
args = ["-backend", "cuda"]

[[arm]]
name = "qwen2.5-coder-0.5b-q4km-cuda" # goinfer's demo:0.5b, and the floor
model_path = "~/models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"
args = ["-backend", "cuda"]

[[arm]]
name = "granite-4.0-h-tiny-q8-cuda"
model_path = "~/models/granite/granite-4.0-h-tiny-Q8_0.gguf"
args = ["-backend", "cuda"]
# A fit probe because goinfer gates its architecture out of the resident runner, not because of memory (amendment 6).
# "unexpected" here means the gate has opened: check goinfer's change log, then make this a measured arm.
expect_fallback = "cpu"

# phi3-mini-4k is retired (the preregistration's amendment 5): goinfer has no tool-calling template for it.

# The two that do not fit 8 GB of VRAM are fit probes (amendment 6): they run last and stop at the fit. goinfer is
# expected to serve each on the CPU, which passes; a GPU fit, a crash or a timeout is reported.
[[arm]]
name = "gpt-oss-20b-mxfp4-cuda"
model_path = "~/models/gpt-oss-20b-MXFP4.gguf"
args = ["-backend", "cuda"]
expect_fallback = "cpu"

[[arm]]
name = "gemma4-26b-q4km-cuda"
model_path = "~/models/gemma4-26b-q4_k_m.gguf"
args = ["-backend", "cuda"]
expect_fallback = "cpu"

# Amendment 7 (approved 2026-10-17): coder-tuned models, fit-checked by day 2026-10-17 16:25 at 16384 on
# cuda-resident (~/tack-runs/e0/fitcheck-coder-2026-10-17). Downloaded with their published sha256 checked; sources
# in the pre-registration. OpenCoder-8B was dropped: its native window is 8192.

[[arm]]
name = "qwen2.5-coder-7b-q4km-cuda"
model_path = "~/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
args = ["-backend", "cuda"]

[[arm]]
name = "seed-coder-8b-q4km-cuda"
model_path = "~/models/seed-coder-8b-instruct-q4_k_m.gguf"
args = ["-backend", "cuda"]
