name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same two gates the day loop uses, over the whole module: tools/touched -all (gofmt, build and vet for GOOS
  # darwin and linux with cgo off, every package's tests) and tools/lint (staticcheck behind its canary). Linux and
  # macOS both run them because darwin-only code (sandbox, launchd, Keychain) only executes on darwin.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/staticcheck
      - name: touched -all
        run: go run ./tools/touched -all
      - name: lint
        run: go run ./tools/lint
      # The store's fsync timings and the gap between a turn's first two events, printed even on a pass: a macOS run once
      # stalled after the first event, and darwin's File.Sync is F_FULLFSYNC (a drive-cache flush). Evidence for the
      # log's durability decision, which is pending with the owner.
      - name: core fsync timing
        run: go test -count=1 -v -run TestTrafficConformsToTheProtocol ./internal/core
      # The fixtures pass on both sides (DESIGN §9.3): the generated Swift types decode and re-encode every fixture
      # event. Go's side is internal/proto's TestFixturesConform; staleness of the Swift file is swiftgen's test.
      - name: swift fixture check
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -o "$RUNNER_TEMP/fixturecheck" apps/macos/Sources/TackProto/*.swift apps/macos/Tests/FixtureCheck/main.swift
          "$RUNNER_TEMP/fixturecheck" proto/fixtures/*.jsonl
