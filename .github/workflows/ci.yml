name: ci

# Push CI runs the Linux job only; the macOS job (darwin-only code: the sandbox, its escape tests, the Swift fixture
# check) runs on a manual dispatch and on release tags (owner, 2026-10-19: the free plan's minutes). Commits that touch
# only docs, statements or eval record files do not run CI; the eval files the tests read (eval/e0/*.toml,
# eval/e1/pilot.jsonl) still do.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "eval/**/*.md"
      - "eval/e1/calibration*.jsonl"
      - "eval/e1/e1-order*.jsonl"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "eval/**/*.md"
      - "eval/e1/calibration*.jsonl"
      - "eval/e1/e1-order*.jsonl"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same two gates the day loop uses, over the whole module: tools/touched -all (gofmt, build and vet for GOOS
  # darwin and linux with cgo off, every package's tests) and tools/lint (staticcheck behind its canary). macOS runs them
  # too, because darwin-only code (sandbox, launchd, Keychain) only executes on darwin, but only on a manual dispatch or
  # a release tag: a push runs Linux alone.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-24.04", "macos-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    # The loopback escape tests need a host on another machine that answers on connect (ADR-005); locally they use
    # nobara's ssh port.
    env:
      TACK_ESCAPE_OUTSIDE: github.com:22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/staticcheck
      - name: touched -all
        run: go run ./tools/touched -all
      - name: lint
        run: go run ./tools/lint
      # The sandbox escape tests (DESIGN §6.6): each escape gets out with no sandbox, is stopped by the profile, and gets
      # out again with only its own section removed. They start sandbox-exec, so they carry a build tag and run here and
      # from the day-loop checker, never inside tack's own sandbox. touched -all above also runs them on macOS.
      - name: sandbox escape tests
        if: runner.os == 'macOS'
        run: go test -count=1 -v -tags sandboxtest ./internal/sandbox/ ./internal/shell/
      # The store's fsync timings and the gap between a turn's first two events, printed even on a pass: a macOS run once
      # stalled after the first event, and darwin's File.Sync is F_FULLFSYNC (a drive-cache flush). Evidence for the
      # log's durability decision, which is pending with the owner.
      - name: core fsync timing
        run: go test -count=1 -v -run TestTrafficConformsToTheProtocol ./internal/core
      # The fixtures pass on both sides (DESIGN §9.3): the generated Swift types decode and re-encode every fixture
      # event. Go's side is internal/proto's TestFixturesConform; staleness of the Swift file is swiftgen's test.
      - name: swift fixture check
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -o "$RUNNER_TEMP/fixturecheck" apps/macos/Sources/TackProto/*.swift apps/macos/Tests/FixtureCheck/main.swift
          "$RUNNER_TEMP/fixturecheck" proto/fixtures/*.jsonl
